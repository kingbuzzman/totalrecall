# SwiftLint checks what swift-format does not: complexity and length, likely bugs, and Swift that has a clearer or
# faster idiom. swift-format owns the layout (make format rewrites it, make lint checks it), so SwiftLint's rules
# about layout are off, where the two would disagree or say the same thing twice.
included:
  - Package.swift
  - Sources
  - Tests
excluded:
  - build

disabled_rules:
  # Layout, which swift-format owns.
  - line_length
  - trailing_comma
  - opening_brace
  - statement_position
  - vertical_parameter_alignment
  - comma
  - colon
  - closure_parameter_position
  - function_name_whitespace
  - return_arrow_whitespace
  - trailing_whitespace
  - vertical_whitespace
  - leading_whitespace
  - multiple_closures_with_trailing_closure
  # Comments mark what is left to do; TODO.md and the issues keep the list.
  - todo
  # Data is turned into a String to show it or to compare a file's signature, where bytes that are not UTF-8 should
  # show, or not match, rather than be handled as a failure.
  - optional_data_string_conversion

opt_in_rules:
  # Likely bugs.
  - identical_operands
  - unhandled_throwing_task
  - overridden_super_call
  - prohibited_super_call
  - private_swiftui_state
  - unowned_variable_capture
  - discouraged_optional_boolean
  - fatal_error_message
  - lower_acl_than_parent
  # A clearer or faster idiom.
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - last_where
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last
  - toggle_bool
  - joined_default_parameter
  - legacy_multiple
  - redundant_nil_coalescing
  - prefer_zero_over_explicit_init
  - prefer_self_type_over_type_of_self
  - static_operator
  - yoda_condition
  - explicit_init
  - unneeded_parentheses_in_closure_argument
  - discouraged_object_literal

# Where the defaults do not fit this code.
large_tuple:
  # Small labelled records, such as (start:, end:, words:), are used throughout instead of one-off types.
  warning: 4
  error: 5
identifier_name:
  # Mathematical and comparison arguments, as in voiceDistance(_ a:, _ b:) and ==(a, b).
  excluded: [a, b, id]
cyclomatic_complexity:
  # A switch over the cases of a command or an event is one decision, however many cases it has.
  ignores_case_statements: true
