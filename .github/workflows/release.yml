name: release

# Publishes a GitHub release when VERSION on master names a version that has no tag yet: builds both tools, then
# creates the v<VERSION> tag on that commit and a release with the tarball attached, its notes taken from the version's
# section of CHANGELOG.md. To release, add that section, bump VERSION and push.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in a row must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The binaries need macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.is-new == 'true'
        run: make release

      - name: Check the binaries
        if: steps.version.outputs.is-new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(./totalrecall --version)" = "$VERSION"
          test "$(./transcribe --version)" = "$VERSION"

      - name: Create the release and tag
        if: steps.version.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The text under "## <VERSION>" in CHANGELOG.md, up to the next version's heading.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning file=CHANGELOG.md::no section for $VERSION; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION" build/totalrecall-"$VERSION"-macos-*.tar.gz* \
            --target "$GITHUB_SHA" --title "totalrecall $VERSION" "${notes[@]}"
