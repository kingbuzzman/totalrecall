name: release

# Publishes a GitHub release when VERSION on master names a version that has no tag yet. It runs only after the
# integration workflow passes on master, and publishes the tarball that run built and tested: it creates the
# v<VERSION> tag on that commit and a release with the tarball attached, its notes taken from the version's section of
# CHANGELOG.md. To release, add that section, bump VERSION and push. To retry, re-run this workflow's run, or run the
# integration workflow on master.

# workflow_run runs with write access whatever triggered it, which is why zizmor flags it. Here the job only acts on
# integration runs of pushes to master (never pull requests), runs nothing from them but the shell below, and publishes
# the tarball they built and tested.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [integration]
    types: [completed]
    branches: [master]

# None by default; the job below asks for only what it needs.
permissions: {}

# Two runs in a row must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: write # to create the release and its tag
      actions: read # to download the tarball from the integration run
    # A pull request from a fork's master branch also counts as master here; only release what was pushed.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    # Nothing is built here, so any runner will do.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The commit integration tested; github.sha is master's latest commit, which may be newer.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check for a new version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tarball
        if: steps.version.outputs.is-new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the tarball
        if: steps.version.outputs.is-new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build
          ls totalrecall-"$VERSION"-macos-*.tar.gz > /dev/null
          shasum -a 256 -c totalrecall-"$VERSION"-macos-*.tar.gz.sha256

      - name: Create the release and tag
        if: steps.version.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The text under "## <VERSION>" in CHANGELOG.md, up to the next version's heading.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning file=CHANGELOG.md::no section for $VERSION; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION" build/totalrecall-"$VERSION"-macos-*.tar.gz* \
            --target "$SHA" --title "totalrecall $VERSION" "${notes[@]}"
