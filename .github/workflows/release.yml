name: release

# Publishes a GitHub release when VERSION on master names a version that has no tag yet. It never runs on its own: the
# integration workflow runs it as its last job, only after its tests pass on a push to master that built the final
# version, and it publishes the tarball that run built and tested: it creates the v<VERSION> tag on that commit and a
# release with the tarball attached, its notes taken from the version's section of CHANGELOG.md. To release, add that
# section, bump VERSION and push. To retry, re-run the integration run's failed jobs.
on:
  workflow_call:

# None by default; the job below asks for only what it needs.
permissions: {}

jobs:
  release:
    name: release
    permissions:
      contents: write # to create the release and its tag
    # Two runs in a row must not race to create the same release.
    concurrency:
      group: release
      cancel-in-progress: false
    # Nothing is built here, so any runner will do.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a new version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tarball
        if: steps.version.outputs.is-new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build

      - name: Check the tarball
        if: steps.version.outputs.is-new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build
          ls totalrecall-"$VERSION"-macos-*.tar.gz > /dev/null
          shasum -a 256 -c totalrecall-"$VERSION"-macos-*.tar.gz.sha256
          # Built as the final version, not a -dev one: each binary embeds its Info.plist, version included, as text.
          tar -xzf totalrecall-"$VERSION"-macos-*.tar.gz totalrecall transcribe
          for tool in totalrecall transcribe; do
            if ! grep -q -a -F "<string>$VERSION</string>" "$tool"; then
              echo "::error::$tool in the tarball is not built as $VERSION"
              exit 1
            fi
          done

      - name: Create the release and tag
        if: steps.version.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The text under "## <VERSION>" in CHANGELOG.md, up to the next version's heading.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning file=CHANGELOG.md::no section for $VERSION; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION" build/totalrecall-"$VERSION"-macos-*.tar.gz* \
            --target "$GITHUB_SHA" --title "totalrecall $VERSION" "${notes[@]}"
