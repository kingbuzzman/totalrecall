name: integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    # The binaries need macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

      - name: Install test audio devices
        run: |
          brew install --cask blackhole-2ch blackhole-16ch blackhole-64ch
          sudo killall coreaudiod || true

      # Only the tests need ffmpeg, so it installs while the build runs; "Wait for ffmpeg" collects it.
      - name: Start installing ffmpeg
        run: |
          nohup sh -c 'brew install ffmpeg; echo $? > "$RUNNER_TEMP/ffmpeg.tmp"; mv "$RUNNER_TEMP/ffmpeg.tmp" "$RUNNER_TEMP/ffmpeg.status"' \
            > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &

      # Its folder is named after its version and macOS minimum, so an older cache is harmless: make builds afresh.
      - name: Cache speexdsp
        uses: actions/cache@v4
        with:
          path: build/speexdsp
          key: speexdsp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: speexdsp-${{ runner.os }}-${{ runner.arch }}-

      # Builds the release tarball too, so .github/workflows/release.yml can publish the binaries tested here.
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" release tests/build/audiolab

      - name: Check the versions
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$(./totalrecall --version)" = "$version"
          test "$(./transcribe --version)" = "$version"

      - name: Grant audio permissions
        run: sudo --preserve-env=CI tests/ci/grant-audio-permissions.sh "$PWD/totalrecall" "$PWD/tests/build/audiolab"

      - name: Wait for ffmpeg
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/ffmpeg.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/ffmpeg.log"
          exit "$(cat "$RUNNER_TEMP/ffmpeg.status")"

      - name: Run integration tests
        run: make test

      - name: Diagnostics
        if: failure()
        run: |
          system_profiler SPAudioDataType || true
          log show --last 15m --style compact --predicate 'subsystem == "com.apple.TCC"' | tail -200 || true

      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/totalrecall-*-macos-*.tar.gz*
          if-no-files-found: error
          retention-days: 1

      - name: Upload recordings and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-recordings
          path: tests/build/results
          if-no-files-found: ignore
