name: integration

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only; nothing here writes to the repository.
permissions:
  contents: read

# A newer push cancels a run still going on the same branch or pull request, except on master: release.yml releases
# from every master run that passes.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  integration:
    name: integration
    # The binaries need macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a push to master whose VERSION has no release yet builds the final version, which release.yml then
      # publishes; every other build reports VERSION-dev<commit>.
      - name: Decide the version
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Building the final $version for release."
            echo "FINAL=1" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: make lint

      - name: Install test audio devices
        run: |
          brew install --cask blackhole-2ch blackhole-16ch blackhole-64ch
          sudo killall coreaudiod || true

      # Only the tests need ffmpeg, so it installs while the build runs; "Wait for ffmpeg" collects it.
      - name: Start installing ffmpeg
        run: |
          nohup sh -c 'brew install ffmpeg; echo $? > "$RUNNER_TEMP/ffmpeg.tmp"; mv "$RUNNER_TEMP/ffmpeg.tmp" "$RUNNER_TEMP/ffmpeg.status"' \
            > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &

      # Its folder is named after its version and macOS minimum, so an older cache is harmless: make builds afresh.
      - name: Cache speexdsp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/speexdsp
          key: speexdsp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: speexdsp-${{ runner.os }}-${{ runner.arch }}-

      # Builds the release tarball too, so .github/workflows/release.yml can publish the binaries tested here, and the
      # build instrumented for coverage.
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" release coverage-build

      # The tests launch totalrecall from Swift's test runners, so they get the grant too.
      - name: Grant audio permissions
        run: |
          toolchain=$(dirname "$(xcrun --find swift)")
          sudo --preserve-env=CI .github/scripts/grant-audio-permissions.sh \
            "$PWD/build/bin/totalrecall" "$(make -s coverage-bin)/totalrecall" \
            "$toolchain/swift-test" "$(cd "$toolchain/../libexec/swift/pm" && pwd)/swiftpm-testing-helper" \
            "$(xcrun --find xctest)"

      - name: Wait for ffmpeg
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/ffmpeg.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/ffmpeg.log"
          exit "$(cat "$RUNNER_TEMP/ffmpeg.status")"

      - name: Run the tests
        run: make test

      # Runs the tests again on the instrumented build: the binaries released stay the uninstrumented ones tested above.
      - name: Check coverage
        run: RESULTS="$PWD/build/test-results/coverage" make coverage

      - name: Diagnostics
        if: failure()
        run: |
          system_profiler SPAudioDataType || true
          log show --last 15m --style compact --predicate 'subsystem == "com.apple.TCC"' | tail -200 || true

      - name: Upload the release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/totalrecall-*-macos-*.tar.gz*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage/html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload recordings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-recordings
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 1
