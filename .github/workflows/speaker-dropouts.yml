name: speaker-dropouts

# TEMPORARY: confirms the recording tests pass reliably on CI, running only them three times in parallel. Separate from
# integration, so release.yml never sees it. Delete once they pass.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speaker-dropouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: attempt ${{ matrix.attempt }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test audio devices
        run: |
          brew install --cask blackhole-2ch blackhole-16ch blackhole-64ch
          sudo killall coreaudiod || true

      - name: Start installing ffmpeg
        run: |
          nohup sh -c 'brew install ffmpeg; echo $? > "$RUNNER_TEMP/ffmpeg.tmp"; mv "$RUNNER_TEMP/ffmpeg.tmp" "$RUNNER_TEMP/ffmpeg.status"' \
            > "$RUNNER_TEMP/ffmpeg.log" 2>&1 &

      - name: Cache speexdsp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/speexdsp
          key: speexdsp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: speexdsp-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" all

      - name: Grant audio permissions
        run: |
          toolchain=$(dirname "$(xcrun --find swift)")
          sudo --preserve-env=CI .github/scripts/grant-audio-permissions.sh \
            "$PWD/build/bin/totalrecall" \
            "$toolchain/swift-test" "$(cd "$toolchain/../libexec/swift/pm" && pwd)/swiftpm-testing-helper" \
            "$(xcrun --find xctest)"

      - name: Wait for ffmpeg
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/ffmpeg.status" ]; do sleep 1; done
          exit "$(cat "$RUNNER_TEMP/ffmpeg.status")"

      # Only the recording tests, so nothing else runs alongside them.
      - name: Run the recording tests
        run: make test TESTS=RecordingTests

      - name: Upload recordings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recordings-${{ matrix.attempt }}
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 3
